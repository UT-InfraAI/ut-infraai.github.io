title: InfraAI Research Blog
description: Experiments, ideas, and explanations from the InfraAI group.
url: "https://ut-infraai.github.io"
baseurl: ""
lang: en
timezone: America/Chicago

# The layouts and styles live in this repository; no external theme is needed.
theme: null
markdown: kramdown
highlighter: rouge
permalink: /:year/:month/:day/:title/

plugins:
  - jekyll-feed
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - templates
